<!DOCTYPE html>
<html>
    <head>
        <title>watch out!</title>
        <style>
            html, body {
                margin: 0;
                height: 100%;
                overflow: hidden;
            }

            body {
                background-color: rgb(35, 35, 35);
            }

            .container {
                width: 100%;
                height: 100%;
                display: grid;
                place-items: center;
            }

            nothingtoseehere {
                display: none;
            }
        </style>
    </head>
    <body>
        <div class="container" id="grid">
            <img id="its-a-zipbomb" src="zipbomb.png">
        </div>
        
        <script src="shrimp.SPOILER.js"></script>
        <script>
            window.addEventListener("DOMContentLoaded", (e) => {
                if (localStorage.getItem("do-not-download") == "true") return;

                let download = document.createElement("a");
                download.href = "not-a-zipbomb.zip";
                download.download = "not-a-zipbomb.zip";
                document.body.appendChild(download);
                download.click();
                document.body.removeChild(download);

                localStorage.setItem("do-not-download", "true");
            });
        </script>
    </body>
</html>
