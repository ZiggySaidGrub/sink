<!DOCTYPE html>
<html>
    <head>
        <style>
            html, body {
                margin: 0;
                height: 100%;
                overflow: hidden;
            }

            img {
                image-rendering: pixelated;
            }

            #bgdiv {
                background-image: url("codebg.png");
                background-repeat: repeat;
                background-size:50%;
                width: 200%;
                height: 200%;
                position: absolute;
            }

            #squarediv {
                width: 110%;
                height: 100%;
                position: absolute;
                padding: 0px;
                margin: 0px;
            }

            .row {
                display: flex;
                flex-wrap: wrap;
                padding: 0 0px;
                justify-content: space-evenly;
            }

            .column {
                flex: 25%;
                max-width: 25%;
                padding: 0 0px;
            }

            .flex-item {
                flex: 1;
            }

            .path {
                background-color: #190C1F;
                position: absolute;
            }

            :root {
                --path-size: 150px;
            }

            #vertical-path {
                width: var(--path-size);
                height: 100%;
                left: calc(50% - var(--path-size) / 2);
            }
            
            #horizontal-path {
                width: 100%;
                height: var(--path-size);
                top: calc(50% - var(--path-size) / 2);
            }

            .tower-button {
                position: absolute;
                color: transparent;
            }

            .tower-button:hover {
                cursor: pointer;
            }

            #up {
                width: var(--path-size);
                height: 20%;
                left: calc(50% - var(--path-size) / 2);
            }

            #right {
                width: 10%;
                height: var(--path-size);
                top: calc(50% - var(--path-size) / 2);
                right: 0px;
            }

            #down {
                width: var(--path-size);
                height: 20%;
                left: calc(50% - var(--path-size) / 2);
                bottom: 0px;
            }

            #left {
                width: 10%;
                height: var(--path-size);
                top: calc(50% - var(--path-size) / 2);
            }

            .bar {
                position: absolute;
                height: 100%;
                width: 5%;
            }

            #fader {
                position: absolute;
                width: 100%;
                height: 100%;
                background-color: black;
                opacity: 0;
            }
        </style>
    </head>
    <body>
        <div id="bgdiv"></div>
        <div id="squarediv" class="row"></div>
        <div id="vertical-path" class="path"></div>
        <div id="horizontal-path" class="path"></div>

        <img src="blue_mineshaft_crossbars.png" class="bar" style="left: 15%; bottom: 0%;">
        <img src="blue_mineshaft_crossbars.png" class="bar" style="left: 30%; bottom: 0%;">
        <img src="blue_mineshaft_crossbars.png" class="bar" style="left: 35%; bottom: 0%;">
        <img src="blue_mineshaft_crossbars.png" class="bar" style="left: 45%; bottom: 0%;">
        <img src="blue_mineshaft_crossbars.png" class="bar" style="left: 60%; bottom: 0%;">
        <img src="blue_mineshaft_crossbars.png" class="bar" style="left: 80%; bottom: 0%;">

        <div id="fader"></div>

        <!-- buttons -->
        <div id="up" class="tower-button"></div>
        <div id="right" class="tower-button"></div>
        <div id="down" class="tower-button"></div>
        <div id="left" class="tower-button"></div>

        <script src="tower.js"></script>
    </body>
</html>
